# AutoAudit Development Docker Compose
#
# Usage with profiles:
#   docker compose up                           # Start infrastructure only (db, redis, opa)
#   docker compose --profile frontend-dev up   # For frontend devs (backend-api + infrastructure, run worker locally)
#   docker compose --profile backend-dev up    # For backend devs (frontend + infrastructure)
#   docker compose --profile worker up         # Add worker to any profile combination
#   docker compose --profile powershell up     # Add PowerShell service for Exchange/Teams cmdlets
#   docker compose --profile all up            # Start all services
#
# Common combinations:
#   docker compose --profile frontend-dev up -d                  # Backend API + infra (worker runs locally)
#   docker compose --profile frontend-dev --profile worker up -d # Backend API + worker + infra
#   docker compose --profile frontend-dev --profile powershell up -d # Backend API + PowerShell service
#
# To run worker locally (for PowerShell/Exchange controls that need Docker access):
#   cd engine && uv run celery -A worker.celery_app worker --loglevel=info
#
# To test collectors with PowerShell service:
#   cd engine && uv run python -m scripts.test_collector -c exchange.organization.organization_config --use-service http://localhost:8001

services:
  # =============================================================================
  # Infrastructure Services (always available)
  # =============================================================================

  db:
    # Phase 10 aligned this major version with everything else. It was one major
    # ahead, while CI (ci.backend-api.yml, ci.engine.yml),
    # tools/ci/container_smoke.py and docker-compose.production.yml all agreed on
    # this one -- so developers exercised a version nothing else tested, and a
    # pg_dump taken from a developer's volume would not have restored into
    # production. tools/ops/backup.py now refuses a cross-major restore outright.
    image: postgres:16
    container_name: autoaudit-db
    environment:
      POSTGRES_USER: autoaudit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: autoaudit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoaudit"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: autoaudit-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.13.1-debug
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    container_name: autoaudit-opa
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "/policies"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./engine/policies:/policies:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # =============================================================================
  # Application Services (profile-controlled)
  # =============================================================================

  backend-api:
    profiles: ["frontend-dev", "all"]
    build:
      context: .
      dockerfile: backend-api/Dockerfile
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/test/public"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: autoaudit-backend-api
    environment:
      # Application environment
      - APP_ENV=dev

      # Required: Database connection (PostgreSQL with asyncpg driver)
      - DATABASE_URL=postgresql+asyncpg://autoaudit:${POSTGRES_PASSWORD:?required}@db:5432/autoaudit

      # Required: JWT signing key (CHANGE IN PRODUCTION)
      - SECRET_KEY=${SECRET_KEY:?required}

      # Public URLs (used for OAuth redirects)
      - BACKEND_PUBLIC_URL=http://localhost:8000
      - FRONTEND_URL=http://localhost:3000

      # Google OAuth (SSO)
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}

      # Required: Redis URL for Celery task queue
      - REDIS_URL=redis://redis:6379

      # Required: OPA server URL for policy evaluation
      - OPA_URL=http://opa:8181

      # Required: Fernet encryption key for M365 credentials at rest
      # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # This will be passed in with a secret provider in production. This is for local use only.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?required}
      # Retired decrypt-only keys; empty in the steady state. Present so a
      # rotation can be rehearsed here before it is performed in production.
      - ENCRYPTION_KEY_DECRYPT_ONLY=${ENCRYPTION_KEY_DECRYPT_ONLY:-}

      # Optional: Path to policies directory (default: /app/policies)
      - POLICIES_DIR=/app/policies

      # Versioned SOC 2 crosswalk mappings, read-only like the policies.
      - MAPPINGS_DIR=/app/mappings

      # Evidence objects live on a named volume, not the container's writable
      # layer, so uploads and generated reports survive a restart and can be
      # retention-managed. Phase 7 keeps them out of the source tree.
      - EVIDENCE_STORAGE_DIR=/app/evidence-store
    volumes:
      # Mount policies directory for benchmark/control discovery API
      - ./engine/policies:/app/policies:ro
      - ./engine/mappings:/app/mappings:ro
      - evidence_store:/app/evidence-store
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
    restart: unless-stopped

  worker: &worker-runtime
    profiles: ["worker", "all"]
    build:
      context: ./engine
      dockerfile: Dockerfile
      args:
        ENGINE_GIT_SHA: ${ENGINE_GIT_SHA:-}
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    container_name: autoaudit-worker
    environment:
      # Required: Database connection (PostgreSQL - worker uses sync driver)
      - DATABASE_URL=postgresql+asyncpg://autoaudit:${POSTGRES_PASSWORD:?required}@db:5432/autoaudit

      # Required: Redis URL for Celery broker
      - REDIS_URL=redis://redis:6379

      # Phase 3 evaluates retained policy snapshots with the image's pinned OPA CLI.
      - OPA_BINARY=/usr/local/bin/opa

      # Required: Must match ENCRYPTION_KEY in backend-api for credential decryption
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?required}
      # Retired decrypt-only keys; empty in the steady state. Present so a
      # rotation can be rehearsed here before it is performed in production.
      - ENCRYPTION_KEY_DECRYPT_ONLY=${ENCRYPTION_KEY_DECRYPT_ONLY:-}

      # Optional: PowerShell service URL for Exchange/Teams cmdlets
      # When set, worker uses HTTP service instead of spawning Docker containers
      - POWERSHELL_SERVICE_URL=http://powershell-service:8001
      - POWERSHELL_SERVICE_SECRET=${POWERSHELL_SERVICE_SECRET:?required}
    volumes:
      - ./engine:/app/engine:ro
      - ./engine/policies:/app/policies:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      opa:
        condition: service_healthy
    restart: unless-stopped

  dispatcher:
    <<: *worker-runtime
    container_name: autoaudit-dispatcher
    command: [python, -m, worker.dispatcher]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["backend-dev", "all"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
    container_name: autoaudit-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    restart: unless-stopped

  powershell-service:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    profiles: ["powershell", "all"]
    platform: linux/amd64
    build:
      context: ./engine/powershell
      dockerfile: Dockerfile
    environment:
      - POWERSHELL_SERVICE_SECRET=${POWERSHELL_SERVICE_SECRET:?required}
      # Phase 9: how many pwsh children this replica may run at once.
      # Set explicitly rather than left on the default of 4: this
      # container is limited to 512M/1.0 CPU above, and each child loads
      # ExchangeOnlineManagement and now lives for up to a 300-second
      # batch. Raise it only together with the memory limit.
      - POWERSHELL_MAX_CONCURRENCY=${POWERSHELL_MAX_CONCURRENCY:-2}
    container_name: autoaudit-powershell-service
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  evidence_store:
