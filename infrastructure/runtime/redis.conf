bind 0.0.0.0
protected-mode yes
port 0
tls-port 6379
tls-cert-file /run/secrets/redis_cert
tls-key-file /run/secrets/redis_key
tls-ca-cert-file /run/secrets/runtime_ca
tls-auth-clients no
aclfile /run/secrets/redis_acl
# Broker contains only identifiers. No disk snapshots, AOF or result backend.
save ""
appendonly no
maxmemory 256mb
maxmemory-policy noeviction
