name: Runtime container CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    name: API and worker container startup
    runs-on: ubuntu-latest
    # The overlay smoke now builds and starts all six production services,
    # including the PowerShell image, which installs three modules from the
    # gallery on a cold cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Build and smoke test disposable containers
        run: python tools/ci/container_smoke.py
      # Phase 10 started db and redis; Phase 11 found what that scope was
      # hiding. This starts all six services, so a service that cannot import
      # its own entrypoint, or a worker that cannot reach the broker, fails here
      # rather than in a customer's deployment.
      - name: Start every production Compose service and check its boundaries
        run: python tools/ci/production_overlay_smoke.py
      - uses: astral-sh/setup-uv@v6
      - name: Reject unsafe Redis transport and authentication
        run: uv run --frozen --project backend-api python tools/ci/runtime_tls_smoke.py
      - name: Verify real PowerShell transport and timeout cleanup
        run: uv run --frozen --project engine --extra dev python tools/ci/runtime_powershell_smoke.py
