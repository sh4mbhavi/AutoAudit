name: "Supply chain"

# Phase 10 adds this. Before it, the only dependency gate in the repository was
# ci.grype.yml, which scans the source DIRECTORY at severity-cutoff critical.
# That means:
#
#   * no SBOM existed for any image, so nothing could enumerate what shipped;
#   * no container IMAGE was ever scanned, so the Debian base layer, the apt
#     packages (build-essential, libpq-dev, tesseract-ocr, curl) and the
#     PowerShell service's Mariner layer were entirely unexamined;
#   * nothing verified that a built image matched the lockfile CI tested with --
#     and engine/Dockerfile did not even copy its lockfile.
#
# The last of those was a real, shipped defect. It is fixed in engine/Dockerfile
# and asserted by tools/tests/test_phase10_supply_chain.py; this workflow is what
# keeps the rest honest.
#
# Every artifact here declares a retention period. Every scan step states plainly
# whether it gates or reports.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  sbom:
    name: Build images, generate SBOMs and scan them
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build the worker image from its lockfile
        # ENGINE_GIT_SHA is not decoration: the Dockerfile refuses to build
        # without a 40-hex revision, and the value is written into every scan's
        # provenance record.
        run: |
          docker build \
            --build-arg ENGINE_GIT_SHA=${{ github.sha }} \
            -t autoaudit-worker:${{ github.sha }} \
            engine

      - name: Build the API image
        run: docker build -f backend-api/Dockerfile -t autoaudit-api:${{ github.sha }} .

      - name: Build the PowerShell service image
        # The third production image, and the only one that authenticates to a
        # customer tenant. Nothing built, SBOM'd or scanned it until now, which
        # is how it came to ship an unpinned base, unpinned gallery modules, a
        # `curl | sh` installer and a Python floor no test knew about.
        run: |
          docker build --platform linux/amd64 \
            -t autoaudit-powershell:${{ github.sha }} \
            engine/powershell

      - name: Verify the worker image matches engine/uv.lock
        # The assertion that would have caught the pre-Phase-10 defect directly.
        run: |
          uv_lock_versions=$(python - <<'PY'
          import json, re, pathlib
          lock = pathlib.Path("engine/uv.lock").read_text()
          print(json.dumps({m.group(1): m.group(2) for m in re.finditer(
              r'\[\[package\]\]\nname = "([^"]+)"\nversion = "([^"]+)"', lock)}))
          PY
          )
          image_versions=$(docker run --rm --entrypoint /app/.venv/bin/python \
            autoaudit-worker:${{ github.sha }} -c \
            'import importlib.metadata as m, json; print(json.dumps({p: m.version(p) for p in ["celery","httpx","sqlalchemy","cryptography","prometheus-client"]}))')
          LOCK="$uv_lock_versions" IMAGE="$image_versions" python - <<'PY'
          import json, os, sys
          lock = json.loads(os.environ["LOCK"])
          image = json.loads(os.environ["IMAGE"])
          bad = {k: (v, lock.get(k)) for k, v in image.items() if lock.get(k) != v}
          if bad:
              print(f"image/lockfile mismatch: {bad}", file=sys.stderr)
              sys.exit(1)
          print(f"image matches engine/uv.lock for {len(image)} package(s)")
          PY

      - name: Generate SBOMs
        uses: anchore/sbom-action@v0
        with:
          image: autoaudit-worker:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-worker.cyclonedx.json
          output-file: sbom-worker.cyclonedx.json

      - name: Generate API SBOM
        uses: anchore/sbom-action@v0
        with:
          image: autoaudit-api:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-api.cyclonedx.json
          output-file: sbom-api.cyclonedx.json

      - name: Generate PowerShell service SBOM
        uses: anchore/sbom-action@v0
        with:
          image: autoaudit-powershell:${{ github.sha }}
          format: cyclonedx-json
          artifact-name: sbom-powershell.cyclonedx.json
          output-file: sbom-powershell.cyclonedx.json

      - name: Record the release manifest
        run: |
          python tools/ops/release_manifest.py \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --image worker=autoaudit-worker:${{ github.sha }} \
            --image api=autoaudit-api:${{ github.sha }} \
            --output release-manifest.json
          cat release-manifest.json

      - name: Scan the worker IMAGE for vulnerabilities
        # ci.grype.yml scans the source directory; this scans what actually
        # ships, including every base-image and apt layer that a directory scan
        # cannot see. Reported, not gating: the pre-existing backlog recorded in
        # earlier phases (0 critical, 51 high, 49 medium) has never been
        # triaged, and turning a gate on now would block every PR on debt this
        # phase did not create. Raising the cutoff is a deliberate decision for
        # the security owner.
        id: image_scan
        uses: anchore/scan-action@v6
        with:
          image: autoaudit-worker:${{ github.sha }}
          grype-version: v0.118.0
          fail-build: false
          severity-cutoff: critical
          output-format: sarif
          output-file: grype-worker-image.sarif

      - name: Upload worker image vulnerability report
        if: always() && steps.image_scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.image_scan.outputs.sarif }}
          category: worker-image

      - name: Scan the API IMAGE for vulnerabilities
        # This step did not exist. Both images were built and both were SBOM'd,
        # and only the worker was ever scanned -- so the API image's Debian
        # layer, its apt packages (curl, tesseract-ocr, libtesseract-dev) and
        # everything opencv pulls in were unexamined. Reported on the same terms
        # as the worker: the backlog predates this change and gating on it now
        # would block every PR on debt this phase did not create.
        id: api_image_scan
        uses: anchore/scan-action@v6
        with:
          image: autoaudit-api:${{ github.sha }}
          grype-version: v0.118.0
          fail-build: false
          severity-cutoff: critical
          output-format: sarif
          output-file: grype-api-image.sarif

      - name: Upload API image vulnerability report
        if: always() && steps.api_image_scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.api_image_scan.outputs.sarif }}
          category: api-image

      - name: Scan the PowerShell service IMAGE for vulnerabilities
        id: powershell_image_scan
        uses: anchore/scan-action@v6
        with:
          image: autoaudit-powershell:${{ github.sha }}
          grype-version: v0.118.0
          fail-build: false
          severity-cutoff: critical
          output-format: sarif
          output-file: grype-powershell-image.sarif

      - name: Upload PowerShell image vulnerability report
        if: always() && steps.powershell_image_scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.powershell_image_scan.outputs.sarif }}
          category: powershell-image

      - name: Upload SBOMs and release manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-${{ github.sha }}
          path: |
            sbom-worker.cyclonedx.json
            sbom-api.cyclonedx.json
            sbom-powershell.cyclonedx.json
            release-manifest.json
            grype-worker-image.sarif
            grype-api-image.sarif
            grype-powershell-image.sarif
          if-no-files-found: warn
          # 90 days: long enough to answer "what was in the build that shipped
          # last quarter", which is the question an auditor asks.
          retention-days: 90

  iac:
    name: Infrastructure-as-code misconfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      # No workflow in this repository scanned infrastructure-as-code by name.
      # Six Dockerfiles and four Compose files defined the entire production
      # topology and nothing checked any of them for misconfiguration.
      #
      # This one GATES from day one, unlike the image scans above, because the
      # backlog it inherits is six LOW DS-0026 findings ("No HEALTHCHECK
      # defined") and nothing else -- verified against the tree it is being
      # added to. A gate installed at a level the repository already meets stays
      # meaningful; one installed above it gets switched off.
      - name: Scan Dockerfiles and Compose files for misconfiguration
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '1'
          format: sarif
          output: trivy-iac.sarif

      - name: Report the LOW backlog without gating on it
        if: always()
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            aquasec/trivy:0.58.1 config --severity LOW --exit-code 0 . || true

      - name: Upload IaC findings
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: iac

      - name: Upload the IaC report
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: iac-${{ github.sha }}
          path: trivy-iac.sarif
          if-no-files-found: warn
          retention-days: 90

  hooks:
    name: Secret and lint hooks, enforced server-side
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run pre-commit
        # detect-secrets and detect-private-key ran only on developer machines.
        # A contributor who never ran `pre-commit install` bypassed the
        # repository's secret controls entirely, with nothing server-side to
        # catch it.
        run: |
          python -m pip install pre-commit==4.0.1
          pre-commit run --all-files --show-diff-on-failure
