name: "Backend + API CI/CD"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '32 23 * * 6'

permissions:
  contents: read

jobs:
  analyze:
    name: Security Analysis on (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

      - name: Install Bandit
        run: pip install bandit==1.8.6

      - name: Run Bandit scan on backend-api
        run: |
          bandit -r backend-api/app -f txt
          bandit -r backend-api/tests -s B101 -f txt

  run-lint:
    name: Linting Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Code Base
        uses: github/super-linter@v4
        env:
          VALIDATE_ALL_CODEBASE: false
          DEFAULT_BRANCH: "main"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_YAML: false
          VALIDATE_GITHUB_ACTIONS: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_JAVASCRIPT_STANDARD: false
          VALIDATE_HTML: false
          VALIDATE_MARKDOWN: false
          VALIDATE_MARKDOWN_PRETTIER: false
          VALIDATE_NATURAL_LANGUAGE: false

  test:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MIGRATION_TEST_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      OPA_BINARY: /usr/local/bin/opa
      AUTOAUDIT_REQUIRE_INTEGRATION: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install locked test environments
        run: |
          python -m pip install uv==0.8.22
          uv sync --frozen --project backend-api --extra dev --extra evidence
          uv sync --frozen --project engine --extra dev
      - name: Install checksum-verified OPA
        run: sudo python tools/ci/install_opa.py /usr/local/bin/opa
      # Phase 9 gate: the frontend's scan types are generated from this very
      # schema, so a response model edited without regenerating them fails here
      # rather than drifting until someone reads a wrong type.
      - name: Check generated frontend API types match the backend OpenAPI schema
        run: uv run --frozen --project backend-api --extra dev --extra evidence python tools/frontend/generate_api_types.py --check
      - name: Run backend, startup, migration and API-worker contract tests
        run: uv run --frozen --project backend-api --extra dev --extra evidence python -m pytest backend-api/tests tools/tests -q

  report:
    name: Report PR status
    needs: [analyze, run-lint, test]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const analyze = '${{ needs.analyze.result }}';
            const lint    = '${{ needs.run-lint.result }}';
            const test    = '${{ needs.test.result }}';

            const icon = r => ({ success: '✅', failure: '❌', cancelled: '🚫', skipped: '⏭️' }[r] ?? '❓');
            const allPassed = [analyze, lint, test].every(r => r === 'success');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const marker = '<!-- ci-report-backend-api -->'; // used to find and update the existing comment

            const body = [
              marker,
              `### CI: Backend API`,
              ``,
              `| Job | Result |`,
              `|---|---|`,
              `| Security analysis (CodeQL + Bandit) | ${icon(analyze)} \`${analyze}\` |`,
              `| Lint | ${icon(lint)} \`${lint}\` |`,
              `| Tests and migrations | ${icon(test)} \`${test}\` |`,
              ``,
              allPassed
                ? `All checks passed.`
                : `One or more checks failed. [View logs](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
