name: Secret example regression checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test tools
        run: python -m pip install uv==0.8.22 pytest==8.4.2
      - name: Scan tracked examples and prove canary rejection
        run: python -m pytest tools/tests/test_secret_scanning.py -q
