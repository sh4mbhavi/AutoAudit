name: Grype Dependency Vulnerability Scan

# Scans dependency manifests across the repo for known vulnerabilities and uploads results to the GitHub Security tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 20 * * 4'

permissions:
  contents: read

jobs:
  grype-scan:
    name: Scan dependencies for vulnerabilities
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Grype directory scan
        uses: anchore/scan-action@v6
        id: scan
        with:
          path: "."
          grype-version: v0.118.0
          fail-build: true
          severity-cutoff: critical
          output-format: sarif
          output-file: grype-report.sarif

      - name: Upload vulnerability report
        if: always() && steps.scan.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
