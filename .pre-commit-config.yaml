repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline', '--no-verify']
        exclude: >-
          (?x)^(
            .*alembic/versions/.*|
            docs/.*
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # Compose overlay files carry Compose's own `!override` and `!reset` tags,
      # which PyYAML's safe loader has no constructor for. Splitting the hook
      # keeps full checking everywhere else instead of adding --unsafe globally
      # or excluding the overlays from YAML checking altogether. Overlays are
      # matched by the `*override.yml` suffix the repository already uses.
      - id: check-yaml
        exclude: '(^|/)[^/]*override\.yml$'
      - id: check-yaml
        name: check yaml (compose overlays, custom tags allowed)
        args: [--unsafe]
        files: '(^|/)[^/]*override\.yml$'
      - id: check-merge-conflict
      - id: detect-private-key
