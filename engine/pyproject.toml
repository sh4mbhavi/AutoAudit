[project]
name = "autoaudit-worker"
version = "0.1.0"
description = "AutoAudit Celery worker for compliance scanning"
requires-python = ">=3.10"
dependencies = [
    "celery[redis]>=5.6.3",
    "httpx>=0.26.0",
    "msal>=1.36.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.1.0",
    "cryptography>=48.0.0",
    "dnspython>=2.4.0",
    # Phase 10: the worker and the dispatcher are the only processes that can
    # observe collection outcomes and scan staleness. Pure Python, no
    # transitive dependencies.
    "prometheus-client>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker", "collectors", "powershell"]
include = ["opa_client.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "fastapi"]
